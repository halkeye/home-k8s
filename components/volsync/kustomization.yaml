apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# "Variables": the consumer must patch these placeholders (see README comment below).
#   PVC_NAME  -> name of the PVC to back up/restore
#   Secret volsync-rclone-config must exist (key: rclone.conf) - add per-app.
#
# Consumer example:
#   components:
#     - ../../components/volsync
#   patches:
#     - target: {kind: ReplicationSource, name: volsync-backup}
#       patch: |-
#         - op: replace
#           path: /spec/sourcePVC
#           value: my-pvc
#     - target: {kind: ReplicationDestination, name: volsync-restore}
#       patch: |-
#         - op: replace
#           path: /spec/rclone/destinationPVC
#           value: my-pvc
#         - op: replace
#           path: /spec/rclone/capacity
#           value: 1Gi

resources:
  - replicationsource.yaml
  - replicationdestination.yaml
  - secret.enc.yaml
