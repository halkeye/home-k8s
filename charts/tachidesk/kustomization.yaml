---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmGlobals:
  chartHome: ./charts/

generatorOptions:
  disableNameSuffixHash: true

namespace: tachidesk

helmCharts:
  - name: app-template
    version: 5.3.0
    repo: https://bjw-s-labs.github.io/helm-charts
    valuesFile: ./values.yaml
    releaseName: tachidesk

components:
  - ../../components/volsync

patches:
  - target: {kind: ReplicationSource, name: volsync-backup}
    patch: |-
      - op: replace
        path: /spec/sourcePVC
        value: tachidesk-config
      - op: replace
        path: /spec/rclone/rcloneDestPath
        value: home-volsync:tachidesk 
      - op: replace
        path: /spec/rclone/moverSecurityContext
        value: { runAsUser: 1026, runAsGroup: 100 }
  - target: {kind: ReplicationDestination, name: volsync-restore}
    patch: |-
      - op: replace
        path: /spec/rclone/destinationPVC
        value: tachidesk-config
      - op: replace
        path: /spec/rclone/capacity
        value: 10Gi
      - op: replace
        path: /spec/rclone/rcloneDestPath
        value: home-volsync:tachidesk 
      - op: replace
        path: /spec/rclone/moverSecurityContext
        value: { runAsUser: 1026, runAsGroup: 100 }
