---
global:
  extraEnvFrom:
    - secretRef:
        name: tempo

tempo:
  reportingEnabled: true
  # storage:
  #   trace:
  #     backend: s3
  #     s3:
  #       endpoint: tor1.digitaloceanspaces.com
  #       bucket: halkeye-tempo
  #       region: tor1
  resources:
    requests:
      cpu: 10m
      memory: 100Mi

  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://prometheus-prometheus.monitoring:9090/api/v1/write"
    processor:
      service_graphs: {}
      span_metrics: {}

    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
serviceMonitor:
  enabled: true

persistence:
  enabled: true
  enableStatefulSetAutoDeletePVC: true
  size: 10Gi

route:
  main:
    enabled: true
    backendPort: 4318
    parentRefs:
      - name: http-gateway
        namespace: envoy-gateway
        sectionName: https
    hostnames: [traces.g4v.dev]
