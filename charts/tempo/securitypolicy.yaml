apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: tempo-apikey-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tempo
  apiKeyAuth:
    credentialRefs:
    - group: ""
      kind: Secret
      name: auth-apikey
    extractFrom:
    - headers:
      - x-api-key


