apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres17
spec:
  instances: 2 # number of db instances
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.5
  primaryUpdateStrategy: unsupervised
  storage:
    size: 75Gi
    storageClass: longhorn
  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg-auth-secrets
  monitoring:
    enablePodMonitor: true

  # plugins:
  # - name: barman-cloud.cloudnative-pg.io
  #   isWALArchiver: true
  #   parameters:
  #     barmanObjectName: s3-pg17-backups

  externalClusters:
  - name: postgres17
    # plugin:
    #   name: barman-cloud.cloudnative-pg.io
    #   parameters:
    #     barmanObjectName: s3-pg17-backups
    #     serverName: postgres17
    barmanObjectStore:
      destinationPath: s3://pg17-backups/
      endpointURL: http://172.16.10.10:9000
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: S3_ACCESS_KEY
        secretAccessKey:
          name: cloudnative-pg-secret
          key: S3_SECRET_KEY
      wal:
        compression: gzip

  resources:
    requests:
      cpu: 500m
    limits:
      memory: 4Gi

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    parameters:
      max_connections: "300"
      shared_buffers: 512MB

  backup:
    barmanObjectStore:
      destinationPath: s3://pg17-backups/
      endpointURL: http://172.16.10.10:9000
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: S3_ACCESS_KEY
        secretAccessKey:
          name: cloudnative-pg-secret
          key: S3_SECRET_KEY
      wal:
        compression: gzip

  # Note: previousCluster needs to be set to the name of the previous
  # cluster when recovering from an existing cnpg cluster
  bootstrap:
    initdb:
      postInitSQL:
        - ALTER SYSTEM SET search_path TO "$user", public, vcord;
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: s3-pg17-backups
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://pg17-backups/
    endpointURL: http://172.16.10.10:9000
    s3Credentials:
      accessKeyId:
        name: cloudnative-pg-secret
        key: S3_ACCESS_KEY
      secretAccessKey:
        name: cloudnative-pg-secret
        key: S3_SECRET_KEY
    wal:
      compression: gzip
