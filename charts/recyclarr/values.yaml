---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
controllers:
  main:
    revisionHistoryLimit: 1
    annotations:
      reloader.stakater.com/auto: 'true'
    containers:
      recyclarr:
        image:
          repository: ghcr.io/recyclarr/recyclarr
          tag: 9.0.0
        env:
          COMPlus_EnableDiagnostics: '0'
          TZ: America/Vancouver
        envFrom:
          - secretRef:
              name: recylarr-secret
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          limits:
            memory: 256Mi
          requests:
            memory: 256Mi
            cpu: 10m
    pod:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
service:
  main:
    controller: main
    ports:
      http:
        port: 7982
route:
  main:
    enabled: true
    parentRefs:
      - name: http-gateway
        namespace: envoy-gateway
        sectionName: https
    hostnames: [recyclarr.g4v.dev]
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: main
            port: http
persistence:
  tmp:
    type: emptyDir
  config:
    type: emptyDir
  configs:
    enabled: true
    type: configMap
    name: recylarr-config
    globalMounts:
      - path: /config/configs
        readOnly: true
