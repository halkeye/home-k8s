---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stash

generatorOptions:
  disableNameSuffixHash: true

helmCharts:
  - name: app-template
    version: 5.3.0
    repo: https://bjw-s-labs.github.io/helm-charts
    valuesFile: values.yaml
    releaseName: stash

resources:
  - pvc.yaml

components:
  - ../../components/volsync

patches:
  - target: {kind: ReplicationSource, name: volsync-backup}
    patch: |-
      - op: replace
        path: /spec/sourcePVC
        value: stash-config
      - op: replace
        path: /spec/rclone/rcloneDestPath
        value: stash
      - op: replace
        path: /spec/rclone/moverSecurityContext
        value: { runAsUser: 1026, runAsGroup: 100, fsGroup: 100, fsGroupChangePolicy: OnRootMismatch }
  - target: {kind: ReplicationDestination, name: volsync-restore}
    patch: |-
      - op: remove
        path: /spec/rclone/destinationPVC
      - op: replace
        path: /spec/rclone/capacity
        value: 10Gi
      - op: replace
        path: /spec/rclone/rcloneDestPath
        value: stash
      - op: replace
        path: /spec/rclone/moverSecurityContext
        value: { runAsUser: 1026, runAsGroup: 100, fsGroup: 100, fsGroupChangePolicy: OnRootMismatch }
