---
controllers:
  main:
    strategy: Recreate
    replicas: 1
    containers:
      app:
        image:
          repository: ghcr.io/meeb/bandcampsync
          tag: latest@sha256:315e0c3673203266a3f123b0b1aca4a458a8d836156d7e163b1d9adf0e80a7e5
        env:
          TZ: America/Vancouver
          IGNORES_FILE: /ignores/ignores.txt
        command: [bandcampsync-service]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          limits:
            memory: 1Gi
          requests:
            memory: 256Mi
            cpu: 10m
    pod:
      securityContext:
        runAsUser: 1026
        runAsGroup: 100
        runAsNonRoot: true
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
persistence:
  tmp:
    type: emptyDir
  config:
    enabled: true
    type: secret
    name: bandcampsync-secret
  ignores:
    enabled: true
    suffix: config
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: nas-apps
    size: 1Gi
  downloads:
    type: nfs
    server: 172.16.10.10
    path: /volume1/Audio/Bandcamp
