---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: music-assistant

helmGlobals:
  chartHome: ./charts/

generatorOptions:
  disableNameSuffixHash: true

helmCharts:
  - name: app-template
    version: 5.3.0
    repo: https://bjw-s-labs.github.io/helm-charts
    valuesFile: values.yaml
    releaseName: music-assistant

resources:
  - pvc.yaml

components:
  - ../../components/volsync

patches:
  - target: {kind: ReplicationSource, name: volsync-backup}
    patch: |-
      - op: replace
        path: /spec/sourcePVC
        value: music-assistant
      - op: replace
        path: /spec/rclone/rcloneDestPath
        value: music-assistant
      - op: replace
        path: /spec/rclone/moverSecurityContext
        value: { }
  - target: {kind: ReplicationDestination, name: volsync-restore}
    patch: |-
      - op: replace
        path: /spec/rclone/capacity
        value: 5Gi
      - op: replace
        path: /spec/rclone/rcloneDestPath
        value: music-assistant
      - op: replace
        path: /spec/rclone/moverSecurityContext
        value: { }
