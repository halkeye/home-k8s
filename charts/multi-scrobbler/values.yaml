---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
controllers:
  main:
    annotations:
      reloader.stakater.com/auto: 'true'
    containers:
      app:
        image:
          repository: docker.io/foxxmd/multi-scrobbler
          tag: 0.17.1
        env:
          TZ: America/Vancouver
          BASE_URL: https://multi-scrobbler.g4v.dev
          CACHE_VALKEY: redis://valkey:6379
        envFrom:
          - secretRef:
              name: multi-scrobbler
        # probes:
        #   liveness: &probes
        #     enabled: true
        #     custom: true
        #     spec:
        #       httpGet:
        #         path: /api/health
        #         port: 9078
        #       initialDelaySeconds: 0
        #       periodSeconds: 10
        #       timeoutSeconds: 1
        #       failureThreshold: 3
        #   readiness: *probes
        #   startup:
        #     enabled: false
        securityContext:
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 9078

serviceMonitor:
  main:
    enabled: true
    endpoints:
      - port: http
        scheme: http
        path: /api/metrics
        interval: 1m
        scrapeTimeout: 30s

route:
  main:
    enabled: true
    parentRefs:
      - name: http-gateway
        namespace: envoy-gateway
        sectionName: https
    hostnames: [multi-scrobbler.g4v.dev]
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: main
            port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /config
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /data
  tmp:
    enabled: true
    type: emptyDir
    medium: Memory
    globalMounts:
      - path: /tmp
  run:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /run
