---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: multi-scrobbler
spec:
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: "prometheus"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  url: https://raw.githubusercontent.com/FoxxMD/multi-scrobbler/refs/heads/master/docsite/static/multiscrobbler-dashboard.json
