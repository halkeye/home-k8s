apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: elengrab-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: elengrab
  oidc:
    provider:
      issuer: "https://auth.g4v.dev/application/o/elengrab/"
    clientID: "lh522ApbpZ1oW6MrZOx7NifAjVTJFoU23h59NK2X"
    clientSecret:
      name: "elengrab-client-secret"
    redirectURL: "https://elengrab.g4v.dev/oauth2/callback"
    logoutPath: "/myapp/logout"
    # openid is added automatically; profile is needed for preferred_username
    scopes:
      - profile
      - email
    # pass the token upstream as Authorization: Bearer so the jwt filter can read claims
    forwardAccessToken: true
  jwt:
    providers:
      - name: authentik
        issuer: "https://auth.g4v.dev/application/o/elengrab/"
        remoteJWKS:
          uri: "https://auth.g4v.dev/application/o/elengrab/jwks/"
        claimToHeaders:
          - claim: preferred_username
            header: X-Auth-Request-User
        extractFrom:
          headers:
            - name: Authorization
              valuePrefix: "Bearer "
