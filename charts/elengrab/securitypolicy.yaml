apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: elengrab-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: elengrab
  oidc:
    provider:
      issuer: "https://auth.g4v.dev/application/o/elengrab/"
    clientID: "lh522ApbpZ1oW6MrZOx7NifAjVTJFoU23h59NK2X"
    clientSecret:
      name: "elengrab-client-secret"
    redirectURL: "https://elengrab-do.g4v.dev/oauth2/callback"
    logoutPath: "/myapp/logout"
