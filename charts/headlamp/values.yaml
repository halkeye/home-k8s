---
deploymentAnnotations:
  reloader.stakater.com/auto: 'true'
httpRoute:
  enabled: true
  parentRefs:
    - name: http-gateway
      namespace: envoy-gateway
      sectionName: https
  hostnames: [headlamp-h.g4v.dev]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: authentik-proxy
          port: 9000
      timeouts:
        request: 0s  # websocket, never time out
        backendRequest: 0s  # websocket, never time out
image:
  registry: ghcr.io
  repository: headlamp-k8s/headlamp
  tag: v0.45.0
config:
  sessionTTL:
  unsafeUseServiceAccountToken: true
pluginsManager:
  enabled: true
  configContent: |-
    ---
    plugins:
      - name: cert-manager
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
        version: 0.1.1
      - name: argocd
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_argocd
        version: 0.1.0-alpha
      - name: envoy-gateway
        source: https://artifacthub.io/packages/headlamp/headlamp-envoy-gateway/envoy-gateway
        version: 0.3.0
      - name: cloudnative-pg
        source: https://artifacthub.io/packages/headlamp/cnpg-headlamp-plugin/cnpg-headlamp-plugin
        version: 0.1.4
      - name: kube-vip
        source: https://artifacthub.io/packages/headlamp/headlamp-kube-vip/headlamp-kube-vip
        version: 1.0.2
    installOptions:
      parallel: true
      maxConcurrent: 2
