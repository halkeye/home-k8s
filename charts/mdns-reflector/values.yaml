---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
controllers:
  main:
    type: daemonset
    pod:
      hostNetwork: true
    containers:
      lms:
        image:
          repository: flungo/avahi
          tag: latest@sha256:f5e4707fb6aada564501910b6c8ecce95db4dc4c3e76ec450a103c8ae55128a4
        env:
          REFLECTOR_ENABLE_REFLECTOR: true
        securityContext:
          privileged: true
        resources:
          requests:
            memory: 250Mi
            cpu: 15m
