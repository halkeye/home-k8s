---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
controllers:
  main:
    type: daemonset
    pod:
      hostNetwork: true
    containers:
      lms:
        image:
          repository: flungo/avahi
          tag: latest@sha256:8bad95c7122b6160da74e542c1c66541569f40a2df180f9a88f388e976e65ac9
        env:
          REFLECTOR_ENABLE_REFLECTOR: true
        securityContext:
          privileged: true
        resources:
          requests:
            memory: 250Mi
            cpu: 15m
