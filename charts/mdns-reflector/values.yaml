---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
controllers:
  main:
    type: daemonset
    pod:
      hostNetwork: true
    containers:
      lms:
        image:
          repository: flungo/avahi
          tag: latest@sha256:f64d34869097e4ac4a6d51ec6d9ebfd9042bb9dddeeea10daf5434b41660bf28
        env:
          REFLECTOR_ENABLE_REFLECTOR: true
        securityContext:
          privileged: true
        resources:
          requests:
            memory: 250Mi
            cpu: 15m
