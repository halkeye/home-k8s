---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
controllers:
  main:
    type: daemonset
    pod:
      hostNetwork: true
    containers:
      lms:
        image:
          repository: flungo/avahi
          tag: latest@sha256:b319019565e43657526db7042407816c6998b350324057e9a3f4b71eb552f7b6
        env:
          REFLECTOR_ENABLE_REFLECTOR: true
        securityContext:
          privileged: true
        resources:
          requests:
            memory: 250Mi
            cpu: 15m
