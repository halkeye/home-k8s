---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
controllers:
  main:
    annotations:
      reloader.stakater.com/auto: 'true'
    strategy: Recreate
    containers:
      # Runs `rclone bisync` for each entry of /bisync/bisync.conf on an interval.
      bisync:
        image:
          repository: rclone/rclone
          tag: 1.76.0
        command: [/bin/sh, /bisync/bisync.sh]
        env:
          TZ: America/Vancouver
          BISYNC_INTERVAL: '3600'
        resources:
          requests:
            memory: 128Mi
            cpu: 10m
          limits:
            memory: 1Gi
    pod:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
configMaps:
  bisync:
    enabled: true
    data:
      # One job per line: <name> <path1> <path2> [extra bisync flags...]
      # e.g.  docs gdrive:Documents /data/documents --resilient --recover
      bisync.conf: |
        jewel-docs gdrive:Documents/Jewel smb:home/Documents/Jewel
        taxes-docs gdrive:Taxes smb:home/Taxes
        backups-docs gdrive:Backups smb:home/Backups
        therapy-docs gdrive:TherapyFiles smb:home/Documents/Therapy
      bisync.sh: |
        #!/bin/sh
        # First run of a job needs --resync to seed the listings.
        while true; do
          grep -v '^\s*\(#\|$\)' /bisync/bisync.conf | while read -r name p1 p2 flags; do
            marker="/cache/bisync-$name.initialized"
            extra=""
            [ -f "$marker" ] || extra="--resync"
            echo "$(date -Iseconds) bisync $name: $p1 <-> $p2"
            # shellcheck disable=SC2086
            if rclone bisync "$p1" "$p2" --config=/config/rclone.conf --cache-dir=/cache $extra $flags; then
              touch "$marker"
            else
              echo "bisync $name failed"
            fi
          done
          sleep "${BISYNC_INTERVAL:-3600}"
        done
persistence:
  config:
    type: secret
    name: 'rclone'
  bisync:
    type: configMap
    identifier: bisync
    defaultMode: 0755
  cache:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
