---
apiVersion: tempo.grafana.com/v1alpha1
kind: TempoStack
metadata:
  name: deo-spaces
spec:
  storage:
    secret:
      name: tempo-spaces
      type: s3
  storageSize: 1Gi
  resources:
    total:
      limits:
        memory: 2Gi
        cpu: 2000m
  template:
    queryFrontend:
      jaegerQuery:
        enabled: true
    gateway:
      enabled: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tracegen
spec:
  backoffLimit: 4
  template:
    spec:
      containers:
        - name: tracegen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/tracegen:latest
          command:
            - "./tracegen"
          args:
            - -otlp-endpoint=tempo-do-spaces-distributor:4317
            - -otlp-insecure
            - -duration=30s
            - -workers=1
      restartPolicy: Never
