apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: whoami-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: whoami
  oidc:
    provider:
      issuer: "https://auth.g4v.dev/application/o/whoami/"
    clientID: "YMtZG6iRtGX7TmNypl4Tucl0VAGHlM8Y6hsvc9G2"
    clientSecret:
      name: "whoami-client-secret"
    redirectURL: "https://whoami-do.g4v.dev/oauth2/callback"
    logoutPath: "/myapp/logout"
    # openid is added automatically; profile is needed for preferred_username
    scopes:
      - profile
      - email
    # pass the token upstream as Authorization: Bearer so the jwt filter can read claims
    forwardAccessToken: true
  jwt:
    providers:
      - name: authentik
        issuer: "https://auth.g4v.dev/application/o/whoami/"
        remoteJWKS:
          uri: "https://auth.g4v.dev/application/o/whoami/jwks/"
        claimToHeaders:
          - claim: preferred_username
            header: X-Auth-Request-User
        extractFrom:
          headers:
            - name: Authorization
              valuePrefix: "Bearer "
