---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: multus

helmCharts:
  - name: app-template
    version: 5.1.0
    repo: https://bjw-s-labs.github.io/helm-charts
    valuesFile: values.yaml
    releaseName: multus

resources:
  - ./templates/crd.yaml
  - ./templates/rbac.yaml
  - ./templates/network-attachment-definitions.yaml
