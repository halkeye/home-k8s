---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: media-vlan-conf
spec:
  config: '{
      "cniVersion": "0.4.0",
      "type": "macvlan",
      "master": "eth10",
      "mode": "bridge",
      "ipam": {
        "type": "host-local",
        "subnet": "172.16.11.0/24",
        "rangeStart": "172.16.11.100",
        "rangeEnd": "172.16.11.200",
        "routes": [
          { "dst": "172.16.11.0/24" }
        ],
        "gateway": "172.16.11.1"
      }
    }'
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: media-macvlan-whereabouts
spec:
  config: |-
    {
      "cniVersion": "0.4.0",
      "type": "macvlan",
      "master": "eth10",
      "mode": "bridge",
      "ipam": {
        "type": "whereabouts",
        "range": "172.16.11.0/24",
        "gateway": "172.16.11.1"
      }
    }
