---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
appConfigs:
  sessionSecret: ''
  oidcClientID: ''
  oidcClientSecret: ''
  wireguardPrivateKey: ''
podAnnotations:
  reloader.stakater.com/auto: 'true'
defaultPodOptions:
  dnsConfig:
    options:
      - name: ndots
        value: '1'
    nameservers: [172.16.10.3]
controllers:
  main:
    initContainers:
      envsubst:
        image:
          repository: bhgedigital/envsubst
          tag: latest@sha256:36a92e9344ef965e9318c8d2f70dd35cad654a4615b889c6a4dd483ca1ddec7c
        command:
          - sh
          - -c
          - envsubst < /config/config.yaml > /data/config.yaml
        envFrom:
          - secretRef:
              name: wg-access-server
    containers:
      main:
        image:
          repository: ghcr.io/freifunkmuc/wg-access-server
          tag: v1.2.1
        env:
          TZ: America/Vancouver
          WG_CONFIG: /data/config.yaml
          WG_VPN_CIDRV6: 0
          WG_VPN_GATEWAY_INTERFACE: eth0
          WG_EXTERNAL_HOST: vpn.gavinmogan.com
          # WG_VPN_ALLOWED_IPS: 0.0.0.0/0, ::/0, 172.16.10.0/24
          WG_STORAGE:
            valueFrom:
              secretKeyRef:
                name: 'wg-access-server-db-secret-wg-access-server'
                key: DB_URL
        envFrom:
          - secretRef:
              name: wg-access-server
        securityContext:
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
            add:
              - NET_ADMIN  # perform various network-related operations
              - SYS_MODULE  # load and unload kernel modules
        resources:
          limits: &resources
            memory: 1Gi
          requests:
            <<: *resources
            cpu: 10m
    pod:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
service:
  main:
    controller: main
    ports:
      http:
        port: 8000
      https:
        port: 8443
  wireguard:
    enabled: true
    controller: main
    type: LoadBalancer
    loadBalancerIP: 172.16.10.203
    annotations:
      kube-vip.io/loadbalancerIPs: 172.16.10.203
      lbipam.cilium.io/ips: 172.16.10.203
    ports:
      wireguard:
        enabled: true
        protocol: UDP
        port: 51820
route:
  main:
    enabled: true
    parentRefs:
      - name: http-gateway
        namespace: envoy-gateway
        sectionName: https
    hostnames: [admin-vpn.g4v.dev]
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: main
            port: http
persistence:
  config:
    enabled: true
    type: configMap
    name: 'wg-access-server'
  data:
    type: emptyDir
  certs:
    enabled: true
    type: secret
    name: wg-access-server-tls
