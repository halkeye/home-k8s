---
# otel-collector-config.yaml
# Borrowed from https://reshamchaudhary.com/homelab/observability-opentelemetry-homelab
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048
  
  memory_limiter:
    check_interval: 5s
    limit_mib: 400
    spike_limit_mib: 100
  
  # Add resource attributes
  resource:
    attributes:
      - key: environment
        value: do-k8s
        action: upsert
  
  # Tail-based sampling: keep 100% of error traces,
  # sample 20% of successful traces
  tail_sampling:
    decision_wait: 10s
    num_traces: 100
    expected_new_traces_per_sec: 50
    policies:
      - name: errors-always
        type: status_code
        status_code:
          status_codes:
            - ERROR
      - name: slow-requests
        type: latency
        latency:
          threshold_ms: 1000
      - name: sample-remainder
        type: probabilistic
        probabilistic:
          sampling_percentage: 100
        # probabilistic:
        #   sampling_percentage: 20

exporters:
  debug:
    verbosity: detailed

  otlp_grpc/tempo:
    endpoint: tempo.tempo.svc.cluster.local:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
  
  prometheus_remote_write:
    endpoint: http://prometheus-prometheus.monitoring:9090/api/v1/write
    tls:
      insecure: true
    resource_constant_labels:
      included:
        - "service.*"
  
  otlp_http/loki:
    endpoint: http://loki.loki:3100/otlp/v1/logs
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 100
    timeout: 30s
    read_buffer_size: 512
    write_buffer_size: 512

  # Collector's own metrics
  prometheus:
    endpoint: 0.0.0.0:8888

service:
  # telemetry: # Collector's own telemetry (handy for debugging)
  #   logs:
  #     level: debug
  #     encoding: json
  #   metrics:
  #     level: detailed

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch, resource]
      exporters: [otlp_grpc/tempo]
    
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus_remote_write]
    
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
