# otel-collector-config.yaml
# Borrowed from https://reshamchaudhary.com/homelab/observability-opentelemetry-homelab
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048
  
  memory_limiter:
    check_interval: 5s
    limit_mib: 400
    spike_limit_mib: 100
  
  # Add resource attributes
  resource:
    attributes:
      - key: environment
        value: do-k8s
        action: upsert
  
  # Tail-based sampling: keep 100% of error traces,
  # sample 20% of successful traces
  tail_sampling:
    decision_wait: 10s
    num_traces: 100
    expected_new_traces_per_sec: 50
    policies:
      - name: errors-always
        type: status_code
        status_code:
          status_codes:
            - ERROR
      - name: slow-requests
        type: latency
        latency:
          threshold_ms: 1000
      - name: sample-remainder
        type: probabilistic
        probabilistic:
          sampling_percentage: 100
        # probabilistic:
        #   sampling_percentage: 20

exporters:
  otlp/tempo:
    endpoint: tempo.tempo.svc.cluster.local:4317
    tls:
      insecure: true
  
  prometheusremotewrite:
    endpoint: http://prometheus-prometheus.monitoring:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
  
  loki:
    endpoint: http://loki.loki:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: false
      job: true

  # Collector's own metrics
  prometheus:
    endpoint: 0.0.0.0:8888

service:
  telemetry:
    # logs:
    #   level: info
    metrics:
      address: 0.0.0.0:8888
  
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch, resource]
      exporters: [otlp/tempo]
    
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [loki]
